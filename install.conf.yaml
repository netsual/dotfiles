- shell:
    - description: Install Ubuntu shell tools
      stdin: true
      stdout: true
      stderr: true
      command: |
        (
          [ -r /etc/os-release ] &&
          . /etc/os-release &&
          [ "${ID:-}" = ubuntu ] || {
            printf '%s\n' 'Error: automatic Linux setup supports Ubuntu only.' >&2
            exit 1
          }
        ) &&
        sudo apt-get update &&
        sudo apt-get install -y zsh fzf zoxide

- link:
    ~/.zshrc:
      path: zsh/.zshrc
      create: true
